[pytest]
# pytest 9 不再支持 ini 的 import-mode 键，用 addopts 注入：
# importlib 模式不把测试文件目录 prepend 到 sys.path——仓库根 server.py 与
# vendor/extensions/*/server.py 同名，prepend 模式会让 import server 解析到
# 扩展 server（无 _call/_tool_*），导致全量跑时集体失败。
addopts = --import-mode=importlib
testpaths = . vendor/extensions
# vendored 库自带测试（pr_test_oracle 的 test_mapper.py 等）非本仓库测试——
# 收集会报 PytestCollectionWarning（TestMapping/TestMapper 类误当测试）
norecursedirs = vendor/extensions/pr-oracle/pr_test_oracle vendor/extensions/*/pr_test_oracle
