[package]
name = "rx-telemetry"
version = "0.1.0"
edition = "2021"
description = "unified-rx 遥测核心（Rust）：工具调用耗时/daemon 心跳/进程资源采集，环形缓冲 + JSONL 落盘，GB 级流式聚合与 tail（Superluminal 式不整载内存）"
license = "MIT"

[[bin]]
name = "rx-telemetry"
path = "src/main.rs"

[lib]
name = "rx_telemetry"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
