# mypy.ini —— 类型门的口径（S171）：让"全 Python 面"能一次量清，而不是靠 `# type: ignore` 压。

[mypy]
# tests/test_s147_gates.py 等会 `import deps_lock / secrets_history`——它们在 scripts/ 下，
# 运行时靠 sys.path.insert 找得到；mypy 需要显式告诉它同一件事（别改成 ignore 抑制）。
mypy_path = scripts
# bench/ 的模块既当顶层（`diag_history`，脚本直接跑）又当包（`bench.diag_history`，被 import）
# ⇒ 不加这条会报 "Source file found twice under different module names"。
explicit_package_bases = True
# 依赖缺失不作为错误面：本仓刻意零第三方（缺库要如实报的是运行期能力探测，不是类型面）。
# 这一条只影响"import 一个没装的包"，不放松任何类型检查。
ignore_missing_imports = True
# 生成物/合成语料不进类型面（`bench/manual_snaps` 是故意写坏的 A/B 夹具；
# `bench/results` 是跑批产物）。同 ruff.toml 的 extend-exclude 口径。
exclude = (?x)^(bench/manual_snaps/|bench/results/|\.git/)
