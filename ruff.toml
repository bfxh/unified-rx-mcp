# ruff 配置（S171）：本仓**自己的**静态门规则集——明示在此，不依赖机器级配置。
#
# 只选"会变成 bug 的那一类"：F（pyflakes：未定义名/未用导入/重复定义）·
# E4/E7/E9（导入与语句的硬错误）· B（bugbear）· DTZ（时间戳无时区）·
# FURB/PERF/PIE/RET/SIM/C4（现代化与简化）· UP（pyupgrade）· I（导入排序）·
# RUF（ruff 自有，含 RUF100 未用 noqa）。
#
# 三个**明示排除**（都是本仓风格，不是缺陷；首测口径：全量 select 会出 12,639 条，
# 其中 RUF001–003 一族独占 10,973——中文注释被判"歧义 Unicode"）：
# · RUF001/002/003：中文注释与字符串——本仓注释就是中文，判"歧义 Unicode"是误伤；
# · PL（pylint 子集）：PLC0415 局部导入/PLW0603 全局量/PLR2004 魔法值全是本仓的自觉选择
#   （局部导入用于避免环、魔法值多在协议解析），复杂度另由 god 门管；
# · S（bandit）：本仓已有 secrets / path-gate / self-attack / data-flow 四道自家安全门，
#   bandit 风格只会对"故意跑子进程、故意写坏文件"的测试与语料面刷噪音。
# 行长（E501）与文档串（D）也不选：格式之争不进 bug 门。
#
# 计数口径见 scripts/lint_gate.py（逐规则棘轮：只准减，新规则出现即红）。

target-version = "py310"
line-length = 100

extend-exclude = [
  "bench/manual_snaps",   # 合成语料（生成物，故意写坏）
  "bench/results",        # 跑批结果
  "spec",
  "docs",
]

[lint]
select = [
  "F", "E4", "E7", "E9",
  "B", "BLE", "C4", "C901", "DTZ", "FURB", "I", "PERF", "PIE", "RET", "RUF", "SIM", "UP",
]
ignore = [
  "RUF001", "RUF002", "RUF003",   # 中文注释/字符串不是"歧义 Unicode"
  "UP031",                        # %-格式化：CLI 输出沿用 printf 口径，动了要重签金样
]
# S171 第二批补入（先量后改）：
# · **BLE（blind-except）**：裸 `except Exception` —— 入册前 68 处（另有 ~26 处已在代码里
#   显式 `# noqa: BLE001 说明`，本仓风格就是"宽捕获必须写理由"）。入册后那些 noqa 变成
#   **有效指令**（RUF100 随之下降），存量 68 处进基线棘轮 ⇒ 新增裸捕获会被拦。
# · **C901（complex-structure，mccabe 默认 max-complexity=10）**：复杂度是**另一维**
#   （god 门只管函数长度）；入册时 61 处，同样进棘轮。
# 代码里 `# noqa: X` 点了名、但**故意不入门**的规则仍登记为"外部规则"，
# 否则 RUF100 把它们当"未用 noqa"，一修就把人工说明（"为什么这里必须这样写"）删掉。
external = ["PLC0415", "E501"]
