name: core

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # VERSION_TAG 对账需要真实 tag（SKIP 不算对账）

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain + build exe
        uses: dtolnay/rust-toolchain@stable
      # S125 修：仓库根 .cargo/config.toml 的 target-dir 是本机绝对路径（S78 workaround），
      # CI 上必须用 env 覆盖（env 优先于 config）——让 exe 落在工具查找的 %TEMP%\rx-rs-target，
      # 否则 EXE_TAG SKIP → 硬门禁失败（S124 首次 CI 实锤）。
      - name: Point cargo target-dir into %TEMP% (override machine-local config)
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value ("CARGO_TARGET_DIR=" + $env:TEMP + "\rx-rs-target")
      # S124：exe 必建——加速工具在 CI 必须真跑，不做静默降级
      - run: cargo build --release --manifest-path rust/Cargo.toml

      # 先扫再建 target：秘密门禁的扫描面 = 干净工作树
      - name: Secrets gate（明文红线：critical/high 不得出测试区）
        run: python -X utf8 scripts/ci_secrets_gate.py

      - name: Selftest hard gate（对账行从"提示"升为"退出码"）
        env:
          UNIFIED_RX_SANDBOX: ${{ github.workspace }}   # selftest 内部 fs 自检在沙盒内跑
        run: python -X utf8 scripts/ci_gate.py

      - name: Install LSP backends (pylsp 系；能力探测失败须如实降级)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-lsp-server jedi pycodestyle pyflakes

      - name: Install rust-analyzer
        shell: pwsh
        run: rustup component add rust-analyzer

      - name: Full test suite
        run: python -X utf8 -m pytest tests/ -q

      - name: Bench dry-run gates (语料/双臂配置契约)
        run: |
          python -X utf8 bench/replay_ab.py --dry-run
          python -X utf8 bench/ab_run.py

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Point cargo target-dir into %TEMP% (同 pytest job：不落机器局部路径)
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value ("CARGO_TARGET_DIR=" + $env:TEMP + "\rx-rs-target")
      - name: cargo test（双绿纪律的 Rust 侧）
        run: cargo test --manifest-path rust/Cargo.toml
      - name: cargo clippy（零告警红线）
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
