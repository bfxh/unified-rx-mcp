name: core

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # VERSION_TAG 对账需要真实 tag（SKIP 不算对账）

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain + build exe
        uses: dtolnay/rust-toolchain@stable
      # S124：exe 必建——加速工具在 CI 必须真跑，不做静默降级。
      # S125 修：target-dir 覆盖只限本步——仓库根 .cargo/config.toml 的 target-dir 是
      # 本机绝对路径（S78 workaround），必须 env 覆盖让 exe 落在工具查找的
      # %TEMP%\rx-rs-target；若用 GITHUB_ENV 全局导出，会污染后续 pytest 的 fixture
      # crate（其 cargo 也跑去共享目录，exe 位置断言即败——CI 实锤）。
      - name: Build Rust acceleration (exe 落在工具查找的 %TEMP%\rx-rs-target)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:TEMP 'rx-rs-target'
          cargo build --release --manifest-path rust/Cargo.toml

      # 先扫再建 target：秘密门禁的扫描面 = 干净工作树
      - name: Secrets gate（明文红线：critical/high 不得出测试区）
        run: python -X utf8 scripts/ci_secrets_gate.py

      - name: Self-attack gate（S138：attack_cruise 判定必须 clean）
        run: python -X utf8 scripts/attack_gate.py

      - name: Data-flow gate（S139：taint 产品面 definite 不得超基线）
        run: python -X utf8 scripts/taint_gate.py

      - name: Tool-face budget gate（S143：tools/list 体量软帽，防无声膨胀）
        run: python -X utf8 scripts/toolface_budget.py

      - name: Secrets-history gate（S147：近 50 提交 diff 面明文红线）
        run: python -X utf8 scripts/secrets_history.py --n 50

      - name: Deps-lock gate（S147：rust 依赖段恒空红线机器化）
        run: python -X utf8 scripts/deps_lock.py

      - name: Selftest hard gate（对账行从"提示"升为"退出码"）
        env:
          UNIFIED_RX_SANDBOX: ${{ github.workspace }}   # selftest 内部 fs 自检在沙盒内跑
        run: python -X utf8 scripts/ci_gate.py

      - name: Install LSP backends (pylsp 系；能力探测失败须如实降级)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-lsp-server jedi pycodestyle pyflakes

      - name: Install rust-analyzer
        shell: pwsh
        run: rustup component add rust-analyzer

      - name: Full test suite
        run: python -X utf8 -m pytest tests/ -q

      - name: Bench dry-run gates (语料/双臂配置契约)
        run: |
          python -X utf8 bench/replay_ab.py --dry-run
          python -X utf8 bench/ab_run.py

      - name: Tool-evals gate（S144：13 个任务级评测 vs 基线，任务失败/体量膨胀即红）
        run: python -X utf8 bench/tool_evals.py --check

  rust:
    runs-on: windows-latest
    # 注意（S125 实锤）：runner 上下文在 job 级 env 不可用（只许 github/needs/strategy/
    # matrix/vars/secrets/inputs）——${{ runner.temp }} 放这会导致 workflow 整体非法
    # （0 秒失败、标题显示文件路径）。故 CARGO_TARGET_DIR 只放 step 级 env。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo test（双绿纪律的 Rust 侧）
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\rx-rs-target
        run: cargo test --manifest-path rust/Cargo.toml
      - name: cargo clippy（零告警红线）
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\rx-rs-target
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
