name: core

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只读仓库内容（本仓没有需要写权限的步骤）——与 RUST WL 仓同款纪律。
permissions:
  contents: read

# 并发纪律（S163）：同一分支/PR 的旧运行立即取消。
# 实测动机：① 一次推送墙钟 5 分 14 秒（run 35753788295），连推 3 次会排队各跑一遍；
# ② 首版按 github.ref 分组时，同一次推送仍会跑两个（push 事件 refs/heads/* 与
#    PR 事件 refs/pull/N/merge 不同组 ⇒ 互不取消）——实测 PR #84 一推两跑。
# 故按**分支名**分组：head_ref（PR）优先，退回 ref_name（push）⇒ 一条分支同时只有一个运行。
concurrency:
  group: core-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── ① 门禁快档（S163 拆分）：**跑一次**，不再随解释器矩阵重复。
  # 实测（run 35753788295，step 级）：全部门合计 8 秒；原实现把同一套门在 3.11/3.14 各跑一遍
  # ⇒ 同一份审核付两遍钱。门与解释器版本无关，故挪出矩阵。
  gates:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # VERSION_TAG 对账需要真实 tag（SKIP 不算对账）
          persist-credentials: false   # 凭据不落盘（本仓无推送步骤）

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: .github/ci-requirements.txt

      # 按 commit 钉死（注释里是对应标签）——浮动 tag 可以被上游重指，钉 SHA 之后
      # 供应链面只剩「我们主动改这一行」。唯一例外见下。
      - name: Install Rust toolchain
        # 例外：该 action 的 ref **就是工具链名**（stable/nightly），无固定 SHA 语义；
        # 钉 SHA 等于钉错东西。同理见 pytest / rust / stress job。
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义

      # S163：构建缓存。实测一次 release 构建 63–80 秒，而一次推送有 6 个 job 需要 exe；
      # 缓存目标 = **工作区内** rust\target（Cargo.toml 在 rust/ 而非仓根 ⇒ workspaces: rust）。
      # S163 二次修正（实测：缓存连续两轮未命中）：rust-cache 的 cache-directories 我指了
      # ${{ runner.temp }}\rx-rs-target，而构建实际落在 pwsh 的 $env:TEMP —— 两者不是同一路径，
      # 于是每处仍要全量编译 63–75 秒。改为**构建进工作区内的 rust/target**（rust-cache 原生缓存，
      # 无需 cache-directories），构建后把 exe 拷到工具查找的 %TEMP%\rx-rs-target\release。
      # S165（定论）：**不缓存构建产物**。实测证据链——actions/cache 恢复 86 MB rust\target 后，
      # cargo 仍打印 Compiling unified-rx-rs 且 "Finished in 1m15s"（与冷跑 1m09s 无异）：
      # checkout 每次把源码 mtime 刷成"现在"，比缓存里的指纹新 ⇒ cargo 判据必然重编；
      # 而唯一能让它接受旧产物的办法是伪造源码 mtime——那会在真实改动时**复用过时产物**（正确性红线，
      # 也正是 rust-cache 默认不缓存工作区 crate 的原因）。本仓 rust/ 零依赖（[dependencies] 空、
      # Cargo.lock 仅 1 包）⇒ 连"只缓存依赖"这条常规路也无东西可存。
      # 结论：这 70 秒 / 处的 release 编译（11 个 bin）是零依赖自研 crate 的固有成本，改由**并行**摊掉
      # （7 job 同起，不占墙钟）；要再压只能动 profile / 缩减 bin 数，那属于 crate 自己的取舍。
      # 以下为历次尝试的根因（留档，别再踩）：
          # S163 三次修正：key 不含路径配置 ⇒ 首次那轮（cache-directories 指错）把"空的
          # rust	arget"存进了同一个 key，之后**命中该空缓存且按 GitHub 规则不再覆盖**
          # （实测 restore 报 "Cache hit ... Cache Size: ~0 MB (659 B)"，构建仍 72s）。
          # 换前缀即重开条目；下次改路径/布局时同理要换。
          # （S164：rust-cache 的两个输入 [prefix-key / cache-workspace-crates] 已随本步移除）
          # S163 四次修正（真根因）：本仓 rust/ 是**零依赖**（[dependencies] 空、Cargo.lock 仅 1 包）
          # ⇒ rust-cache 默认只缓存「依赖」、不缓存工作区自己的产物 ⇒ 缓存恒为 659 字节、构建恒 70s。
          # 打开 cache-workspace-crates 让工作区产物也进缓存（正确性由 cargo 指纹保证：源码变则重编）。
          # （S164：见上。）

      # S124：exe 必建——加速工具在 CI 必须真跑，不做静默降级。
      # S125 修：target-dir 覆盖只限本步——仓库根 .cargo/config.toml 的 target-dir 是本机
      # 绝对路径（S78 workaround），必须 env 覆盖；若用 GITHUB_ENV 全局导出，会污染后续
      # pytest 的 fixture crate（其 cargo 也跑去共享目录，exe 位置断言即败——CI 实锤）。
      # S163 二次修正：覆盖到**工作区内** rust\target（可缓存），再拷 exe 到工具查找的
      # %TEMP%\rx-rs-target\release（口径见 spec/ROUNDLOG.md「Rust exe 部署到 TEMP 从来不是拷贝」）。
      - name: Build Rust acceleration（构建入 rust\target ⇒ 拷到 %TEMP%\rx-rs-target）
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          $dst = Join-Path $env:TEMP 'rx-rs-target\release'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item rust\target\release\*.exe $dst -Force
          Write-Host "已拷 $((Get-ChildItem $dst\*.exe).Count) 个 exe → $dst"

      # 先扫再建 target：秘密门禁的扫描面 = 干净工作树
      - name: Secrets gate（明文红线：critical/high 不得出测试区）
        run: python -X utf8 scripts/ci_secrets_gate.py

      - name: Self-attack gate（S138：attack_cruise 判定必须 clean）
        run: python -X utf8 scripts/attack_gate.py

      - name: Data-flow gate（S139：taint 产品面 definite 不得超基线）
        run: python -X utf8 scripts/taint_gate.py

      - name: Tool-face budget gate（S143：tools/list 体量软帽，防无声膨胀）
        run: python -X utf8 scripts/toolface_budget.py

      - name: Secrets-history gate（S147：近 50 提交 diff 面明文红线）
        run: python -X utf8 scripts/secrets_history.py --n 50

      - name: Path gate（S162：符号链接/文件名卫生/≤1MB/越界写/软链接逃逸——与 key 门并列）
        run: python -X utf8 scripts/path_gate.py

      - name: Deps-lock gate（S147：rust 依赖段恒空红线机器化）
        run: python -X utf8 scripts/deps_lock.py

      - name: Selftest hard gate（对账行从"提示"升为"退出码"）
        env:
          UNIFIED_RX_SANDBOX: ${{ github.workspace }}   # selftest 内部 fs 自检在沙盒内跑
        run: python -X utf8 scripts/ci_gate.py

      # ── S163 补齐：这 4 道此前只在本地快门（local_gate.py --fast）里跑，CI 侧漏了。
      # 实测四道合计 1.4 秒（audit 0.1 / model-fit 0.2 / cli-bench 0.9 / stress 0.2）。
      - name: Audit-freshness gate（审计账本时效/对账）
        run: python -X utf8 scripts/audit_ledger.py

      - name: Model-fit gate（弱模型模拟 + 回包预算 + 一形态）
        run: python -X utf8 scripts/model_fit_gate.py

      - name: CLI-bench gate（命令行：输出金标准 + 计时——不变质量）
        run: python -X utf8 bench/cli_bench.py --check-golden --check

      # S167：上帝对象门（可移植：scripts/god_gate.py + god.gate.json 抄到别的仓即可用）。
      # 棘轮语义：任何指标超过基线值即红（不许变胖）；低于基线可 --write-baseline 收紧（只准减）。
      - name: God-object gate（文件/函数/类型规模棘轮——只准减）
        run: python -X utf8 scripts/god_gate.py

      # S169：重复代码门（管"多处雷同"，与上帝对象门管"单点过大"是两件事）。
      # 引擎复用 rx-scan sketch（与 MCP 工具 near_dupes 同源），基线棘轮：新增重复对即红。
      - name: Dupe gate（重复代码——新增即红）
        run: python -X utf8 scripts/dupe_gate.py

      # 这两道原在 pytest job 里（随之在矩阵两腿各跑一遍）；它们是快档门 → 收进本 job。
      - name: Perf gate（S160：同机并行/串行比值——不依赖 runner 绝对速度）
        run: python -X utf8 scripts/perf_gate.py

      - name: MCP surface gate（S160：真实 stdio 握手校验对外契约）
        run: python -X utf8 scripts/mcp_surface_gate.py

      # 以下两步原在 pytest job（会随矩阵+分片跑 4 遍）；它们是契约/评测基线，挪进本 job 跑一次。
      - name: Install LSP backends（tool-evals 需要 pytest；顺带与 pytest job 环境对齐）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci-requirements.txt

      # S171：Python 静态门（ruff）。规则集明示在仓内 ruff.toml；逐规则棘轮（只准减），
      # ruff 版本钉在 .github/ci-requirements.txt（工具缺失 → 门 FAIL，不静默降级）。
      # **必须排在上面那条安装步之后**——本 job 前半段步骤不装 pytest 系依赖，ruff 也没有。
      - name: Lint gate（Python 静态分析——逐规则棘轮，只准减）
        run: python -X utf8 scripts/lint_gate.py

      # S171：Python 类型门（mypy 默认档零容忍）——与 lint 门不是一类：那管语法/常见错，
      # 这管类型面。首次启用即清零（19 → 0），故不设基线：冒一条即红。版本钉在 ci-requirements。
      - name: Type gate（mypy 默认档——产品面 0 error）
        run: python -X utf8 scripts/type_gate.py

      # S171：拼写门（typos 零容忍）。生成物排除 + 域名术语自映射都在 _typos.toml（写理由）；
      # typos 版本钉在 ci-requirements（退出码 2 = 有命中）。
      - name: Typos gate（拼写——零容忍）
        run: python -X utf8 scripts/typos_gate.py

      # S172：凭据泄漏门·业界规则库（gitleaks 8.30.1，钉版下载）——补自家 secrets 门的
      # 通用熵/提供商规则面；夹具豁免在 .gitleaks.toml（每条写理由）。本地优先：
      # 本机走 /c/vxl-wl-tools 同版二进制。
      - name: Install gitleaks 8.30.1（钉版）
        shell: pwsh
        run: |
          curl.exe -sL -o ${{ runner.temp }}/gl.zip https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip
          Expand-Archive ${{ runner.temp }}/gl.zip -DestinationPath ${{ runner.temp }}/gl -Force
          Add-Content $env:GITHUB_PATH ${{ runner.temp }}/gl
      - name: Gitleaks gate（凭据泄漏——业界规则库，零容忍）
        run: python -X utf8 scripts/gitleaks_gate.py

      # S173：质量-速度契约门——perf 提交必须带 EVIDENCE 行（对拍一致/行为变更+理由/
      # 基础设施 三选一，见 spec/CD-PLATFORM.md §三）。提速不得是质量的债务转移。
      - name: Quality pact gate（perf 提交必须带 EVIDENCE）
        run: python -X utf8 scripts/quality_pact_gate.py

      # 以下两步原在 pytest job（会随矩阵+分片跑 4 遍）；它们是契约/评测基线，挪进本 job 跑一次。
      # S163 实锤：tool-evals 的 edit_and_test 任务是"改测试由红转绿"，**要用 pytest 跑测试**——
      # 该依赖原由 pytest job 的 LSP 安装步提供，挪步时漏了 ⇒ 首跑 CI 红（err=1 REGRESS）。
      - name: Bench dry-run gates (语料/双臂配置契约)
        run: |
          python -X utf8 bench/replay_ab.py --dry-run
          python -X utf8 bench/ab_run.py

      - name: Tool-evals gate（S144：13 个任务级评测 vs 基线，任务失败/体量膨胀即红）
        run: python -X utf8 bench/tool_evals.py --check

      # S172：Rust 覆盖率棘轮（llvm-cov 只准升）。基线首次由本 job 取数（本地 windows-gnu
      # 无 profiler runtime / msvc 无 link.exe，测不了——coverage_gate.py 文档串有实测记录）。
      # install-action 钉 SHA（test_s124 机器锁要求）；llvm-cov 版本 0.9.1（与 RUST-WL 同钉）。
      - name: Install cargo-llvm-cov 0.9.1
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage gate（行覆盖率——只准升；无基线=只观测）
        run: python -X utf8 scripts/coverage_gate.py

  # ── ② 全量测试（双解释器 × 二分片）：只跑测试，不再重复门禁。
  # S163 关键路径实测：整改前墙钟 5 分 12 秒**全在本 job**（构建 80s + 测试 181s + 依赖 36s）；
  # 而"测试并行化"唯一安全形态是**分片到不同 job**——
  #   · pytest-xdist 在本套件上**否证**（本机实测 -n 4：31 failed / 125 errors，全是 Windows
  #     共享路径 PermissionError；进程内并行会互踩 session/诊断目录）；
  #   · 分片按**文件名轮询**切（确定性、自维护、无需维护清单）：本机实测 413 + 486 = 899 passed
  #     3 skipped，与串行完全一致，单片 45s（对 88s）。
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        shard: [1, 2]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # VERSION_TAG 对账需要真实 tag（SKIP 不算对账）
          persist-credentials: false   # 凭据不落盘（本仓无推送步骤）

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: .github/ci-requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义

      # S163 二次修正：构建进工作区 rust\target（rust-cache 原生缓存），再拷 exe 到工具查找的
      # %TEMP%\rx-rs-target\release（实测：原先指 runner.temp 作 cache-directories 时两轮都没命中）。
      # S165（定论）：**不缓存构建产物**。实测证据链——actions/cache 恢复 86 MB rust\target 后，
      # cargo 仍打印 Compiling unified-rx-rs 且 "Finished in 1m15s"（与冷跑 1m09s 无异）：
      # checkout 每次把源码 mtime 刷成"现在"，比缓存里的指纹新 ⇒ cargo 判据必然重编；
      # 而唯一能让它接受旧产物的办法是伪造源码 mtime——那会在真实改动时**复用过时产物**（正确性红线，
      # 也正是 rust-cache 默认不缓存工作区 crate 的原因）。本仓 rust/ 零依赖（[dependencies] 空、
      # Cargo.lock 仅 1 包）⇒ 连"只缓存依赖"这条常规路也无东西可存。
      # 结论：这 70 秒 / 处的 release 编译（11 个 bin）是零依赖自研 crate 的固有成本，改由**并行**摊掉
      # （7 job 同起，不占墙钟）；要再压只能动 profile / 缩减 bin 数，那属于 crate 自己的取舍。
      # 以下为历次尝试的根因（留档，别再踩）：
          # S163 三次修正：key 不含路径配置 ⇒ 首次那轮（cache-directories 指错）把"空的
          # rust	arget"存进了同一个 key，之后**命中该空缓存且按 GitHub 规则不再覆盖**
          # （实测 restore 报 "Cache hit ... Cache Size: ~0 MB (659 B)"，构建仍 72s）。
          # 换前缀即重开条目；下次改路径/布局时同理要换。
          # （S164：rust-cache 的两个输入 [prefix-key / cache-workspace-crates] 已随本步移除）
          # S163 四次修正（真根因）：本仓 rust/ 是**零依赖**（[dependencies] 空、Cargo.lock 仅 1 包）
          # ⇒ rust-cache 默认只缓存「依赖」、不缓存工作区自己的产物 ⇒ 缓存恒为 659 字节、构建恒 70s。
          # 打开 cache-workspace-crates 让工作区产物也进缓存（正确性由 cargo 指纹保证：源码变则重编）。
          # （S164：见上。）

      - name: Build Rust acceleration（构建入 rust\target ⇒ 拷到 %TEMP%\rx-rs-target）
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          $dst = Join-Path $env:TEMP 'rx-rs-target\release'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item rust\target\release\*.exe $dst -Force
          Write-Host "已拷 $((Get-ChildItem $dst\*.exe).Count) 个 exe → $dst"

      - name: Install LSP backends (pylsp 系；能力探测失败须如实降级)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/ci-requirements.txt

      - name: Install rust-analyzer
        shell: pwsh
        run: rustup component add rust-analyzer

      - name: Full test suite（分片 ${{ matrix.shard }}/2）
        shell: bash
        run: |
          files=$(python -c "import pathlib;fs=sorted(p.as_posix() for p in pathlib.Path('tests').glob('test_*.py'));i=${{ matrix.shard }}-1;print(' '.join(fs[i::2]))")
          echo "分片 ${{ matrix.shard }}/2：$(echo $files | wc -w) 个测试文件"
          python -X utf8 -m pytest -q $files

  # ── ③ Rust 侧（双绿纪律的另一半）：与 ①② 并行跑
  rust:
    runs-on: windows-latest
    # 注意（S125 实锤）：runner 上下文在 job 级 env 不可用（只许 github/needs/strategy/
    # matrix/vars/secrets/inputs）——${{ runner.temp }} 放这会导致 workflow 整体非法
    # （0 秒失败、标题显示文件路径）。故 CARGO_TARGET_DIR 只放 step 级 env。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 凭据不落盘（本仓无推送步骤）
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] 例外同 pytest job：ref 即工具链名
        with:
          components: clippy
      # S165（定论）：**不缓存构建产物**。实测证据链——actions/cache 恢复 86 MB rust\target 后，
      # cargo 仍打印 Compiling unified-rx-rs 且 "Finished in 1m15s"（与冷跑 1m09s 无异）：
      # checkout 每次把源码 mtime 刷成"现在"，比缓存里的指纹新 ⇒ cargo 判据必然重编；
      # 而唯一能让它接受旧产物的办法是伪造源码 mtime——那会在真实改动时**复用过时产物**（正确性红线，
      # 也正是 rust-cache 默认不缓存工作区 crate 的原因）。本仓 rust/ 零依赖（[dependencies] 空、
      # Cargo.lock 仅 1 包）⇒ 连"只缓存依赖"这条常规路也无东西可存。
      # 结论：这 70 秒 / 处的 release 编译（11 个 bin）是零依赖自研 crate 的固有成本，改由**并行**摊掉
      # （7 job 同起，不占墙钟）；要再压只能动 profile / 缩减 bin 数，那属于 crate 自己的取舍。
      # 以下为历次尝试的根因（留档，别再踩）：
          # S163 三次修正：key 不含路径配置 ⇒ 首次那轮（cache-directories 指错）把"空的
          # rust	arget"存进了同一个 key，之后**命中该空缓存且按 GitHub 规则不再覆盖**
          # （实测 restore 报 "Cache hit ... Cache Size: ~0 MB (659 B)"，构建仍 72s）。
          # 换前缀即重开条目；下次改路径/布局时同理要换。
          # （S164：rust-cache 的两个输入 [prefix-key / cache-workspace-crates] 已随本步移除）
          # S163 四次修正（真根因）：本仓 rust/ 是**零依赖**（[dependencies] 空、Cargo.lock 仅 1 包）
          # ⇒ rust-cache 默认只缓存「依赖」、不缓存工作区自己的产物 ⇒ 缓存恒为 659 字节、构建恒 70s。
          # 打开 cache-workspace-crates 让工作区产物也进缓存（正确性由 cargo 指纹保证：源码变则重编）。
          # （S164：见上。）
      - name: cargo test（双绿纪律的 Rust 侧）
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
        run: cargo test --manifest-path rust/Cargo.toml
      - name: cargo clippy（零告警红线）
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings

  # ── ④ 高压语料（S163 补齐）：此前只在本地全门里跑。独立 job ⇒ 不占别人的墙钟；
  # "并发档需独占锁"在 CI 上是天然独占。本机实测 18 例 full 档 0.2–1 秒。
  stress:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名，无固定 SHA 语义
      # S163 二次修正：构建进工作区 rust\target（rust-cache 原生缓存），再拷 exe 到工具查找的
      # %TEMP%\rx-rs-target\release。
      # S165（定论）：**不缓存构建产物**。实测证据链——actions/cache 恢复 86 MB rust\target 后，
      # cargo 仍打印 Compiling unified-rx-rs 且 "Finished in 1m15s"（与冷跑 1m09s 无异）：
      # checkout 每次把源码 mtime 刷成"现在"，比缓存里的指纹新 ⇒ cargo 判据必然重编；
      # 而唯一能让它接受旧产物的办法是伪造源码 mtime——那会在真实改动时**复用过时产物**（正确性红线，
      # 也正是 rust-cache 默认不缓存工作区 crate 的原因）。本仓 rust/ 零依赖（[dependencies] 空、
      # Cargo.lock 仅 1 包）⇒ 连"只缓存依赖"这条常规路也无东西可存。
      # 结论：这 70 秒 / 处的 release 编译（11 个 bin）是零依赖自研 crate 的固有成本，改由**并行**摊掉
      # （7 job 同起，不占墙钟）；要再压只能动 profile / 缩减 bin 数，那属于 crate 自己的取舍。
      # 以下为历次尝试的根因（留档，别再踩）：
          # S163 三次修正：key 不含路径配置 ⇒ 首次那轮（cache-directories 指错）把"空的
          # rust	arget"存进了同一个 key，之后**命中该空缓存且按 GitHub 规则不再覆盖**
          # （实测 restore 报 "Cache hit ... Cache Size: ~0 MB (659 B)"，构建仍 72s）。
          # 换前缀即重开条目；下次改路径/布局时同理要换。
          # （S164：rust-cache 的两个输入 [prefix-key / cache-workspace-crates] 已随本步移除）
          # S163 四次修正（真根因）：本仓 rust/ 是**零依赖**（[dependencies] 空、Cargo.lock 仅 1 包）
          # ⇒ rust-cache 默认只缓存「依赖」、不缓存工作区自己的产物 ⇒ 缓存恒为 659 字节、构建恒 70s。
          # 打开 cache-workspace-crates 让工作区产物也进缓存（正确性由 cargo 指纹保证：源码变则重编）。
          # （S164：见上。）
      - name: Build Rust acceleration（构建入 rust\target ⇒ 拷到 %TEMP%\rx-rs-target）
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\rust\target
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          $dst = Join-Path $env:TEMP 'rx-rs-target\release'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item rust\target\release\*.exe $dst -Force
          Write-Host "已拷 $((Get-ChildItem $dst\*.exe).Count) 个 exe → $dst"
      - name: Stress corpus run（full 档：错误形状/成功形状/路由/溢出）
        run: python -X utf8 bench/stress_run.py --tier full

  # ── 跨平台适配第一腿（S173，用户：不同系统/不同版本的适配）：
  # Rust 侧跨平台是干净的（零依赖 + std），linux 腿验证"没有意外依赖 Windows 特性"。
  # Python 侧的跨平台腿后续加（tests 里有 Windows 路径假设，要先梳理）。
  cross-linux:
    runs-on: ubuntu-latest
    # S173：跨平台腿**先以"只报告不阻塞"运行**——linux 上已暴露的真实债（按价值记录）：
    # ① [已修] advapi32/kernel32/user32 FFI 链接失败 ⇒ sysinfo 域 cfg(windows) 门控 + 占位模块；
    # ② [已修] 仓根 .cargo/config.toml 的本机绝对路径 target-dir 污染 LD_LIBRARY_PATH ⇒ env 覆盖；
    # ③ [债，P1 拆] astscan 5 场景行为差：crlf_reads_as_universal_newlines /
    #    crlf_python_lines_preserved / js_masking_calls_and_templates /
    #    secret_literal_masked_shape / dir_quota_caps_and_single_file_bypasses
    #    （linux 上掩码/规则产出为空——需在 linux 环境复现后修，别盲改）。
    #    ①②③ 均已修（sysinfo cfg 门控 / target-dir env 覆盖 / 路径分隔符平台化），
    #    linux 测试全绿 ⇒ 撤 continue-on-error，此腿转**正式阻塞门**（S173 完成）。
    # ⭐ 必须覆盖 target-dir：仓库根 .cargo/config.toml 的 [build] target-dir 是**本机
    # 绝对路径**（S78 中文路径 workaround，注释写明 CI 靠 env 覆盖）——linux 上 rustup
    # 拿它拼 LD_LIBRARY_PATH ⇒ "path segment contains separator `:`"（两跑实锤：清空/
    # 卸载 LD_LIBRARY_PATH 都没用，得覆盖根因）。runner 上下文只在 step 级可用。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 凭据不落盘
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses] ref 即工具链名
      - name: cargo test（linux）
        run: cargo test --manifest-path rust/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rx-target
      - name: cargo build --release（linux 产物可构建）
        run: cargo build --release --manifest-path rust/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rx-target
