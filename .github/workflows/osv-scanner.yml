---
# OSV 漏洞数据库扫描 - 使用 Google OSV 数据库扫描已知漏洞
name: "OSV Scanner"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  osv-scanner:
    name: OSV Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --recursive
            --format=json
            --output=osv-results.json
            ./

      - name: Run OSV-Scanner on commits
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        if: github.event_name == 'push'
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./

      - name: Upload OSV results to GitHub Security
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        if: always()
        with:
          sarif_file: osv-results.sarif

      - name: Upload OSV artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: osv-scanner-results
          path: osv-results.*
          retention-days: 3
