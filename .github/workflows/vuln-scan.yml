name: vuln-scan

# 自动漏洞扫描（常态挖漏洞 · unified-rx MCP 端）
# 每次 push/PR 自动跑：bandit(安全静态分析) + bug_scan 自扫(MCP 挖自己)
# + pip-audit(依赖漏洞)。与本地 scripts/vuln-scan.mjs 双端闭环。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (Python 安全扫描)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bandit
        run: |
          python -m pip install bandit==1.8.3
          bandit -q -r . -x vendor,tests,test_unified_rx.py -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif

  selfscan:
    name: bug_scan 自扫 (MCP 挖自己)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-scan with bug_scan
        run: |
          python - <<'EOF'
          import json, server
          r = server._call('bug_scan', {'path': '.', 'max_files': 200})[0]
          d = json.loads(r.text)
          issues = d.get('issues', [])
          errs = [i for i in issues if i.get('severity') == 'error']
          print(f"bug_scan 自扫: {len(issues)} findings ({len(errs)} error, {len(issues)-len(errs)} warning)")
          for i in issues[:30]:
              print(f"  {i.get('severity')} {i.get('rule')} {i.get('file')}:{i.get('line')} {i.get('msg','')[:120]}")
          if errs:
              raise SystemExit(1)
          EOF

  deps:
    name: pip-audit (依赖漏洞)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.9.0 mcp httpx
          python -m pip_audit
        continue-on-error: true
