---
# GitHub Action 安全最佳实践检查 - 检查工作流文件的安全性
name: "GitHub Action Security Check"

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  # zizmor online-audits + advanced-security 需要 API 访问
  # （"Resource not accessible by integration" 修复）
  actions: read
  security-events: write

jobs:
  action-security:
    name: Action Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run zizmor for GitHub Actions security
        uses: zizmorcore/zizmor-action@v0.6.2

      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -color
        # 硬门禁（P0-3）：workflow 语法错误必须红——软门禁等于没门禁

      - name: Check for pinned actions
        run: |
          echo "Checking if all actions are pinned to commit SHAs..."
          grep -rn "uses:" .github/workflows/ | grep -v "@" | while read line; do
            echo "WARNING: Unpinned action found: $line"
          done || true
        # 已知债务（棘轮：旧债容忍）：仓库仍有多处 @tag pin，全量 pin SHA 是独立任务；
        # 硬门禁化之前先清零债务（新增未 pin 在 PR review 中把关）
