name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 扩展层依赖（cae/pr-oracle/tautest 的 server.py 顶层 import）
          python -m pip install mcp httpx pytest

      - name: Assemble extension layout (_EXT_BASE = mcp-servers/)
        run: |
          mkdir -p mcp-servers
          cp -r vendor/extensions/code-analysis-enhance mcp-servers/
          cp -r vendor/extensions/pr-oracle mcp-servers/
          cp -r vendor/extensions/tautest mcp-servers/

      - name: Run pytest suite
        run: python -m pytest test_unified_rx.py -q

      - name: Run selftest
        run: python server.py --selftest
