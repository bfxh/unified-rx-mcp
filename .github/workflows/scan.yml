name: scan

on:
  schedule:
    - cron: '23 3 * * 1'   # 每周一 03:23 UTC：审计周扫（明文 + 自攻 + 数据流）
  workflow_dispatch:

# 最小权限：周扫只读仓库内容——与 core.yml 同款纪律。
permissions:
  contents: read

jobs:
  audit-sweep:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # 凭据不落盘
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install Rust toolchain
        # 例外同 core.yml：ref 即工具链名，无固定 SHA 语义
        uses: dtolnay/rust-toolchain@stable
      # S139：自攻/数据流门都要 exe——target-dir 覆盖只限本步（同 core.yml 纪律）
      - name: Build Rust acceleration (exe 落在 %TEMP%\rx-rs-target)
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:TEMP 'rx-rs-target'
          cargo build --release --manifest-path rust/Cargo.toml

      # 历史提交不在此扫（push protection 在推送侧兜底新推送；改史治理见 spec/HARDENING.md）
      - name: secrets_hunt 全仓周扫（critical/high 出测试区即红）
        run: python -X utf8 scripts/ci_secrets_gate.py

      - name: Self-attack gate（周扫同款：attack_cruise 判定必须 clean）
        run: python -X utf8 scripts/attack_gate.py

      - name: Data-flow gate（周扫同款：taint 产品面 definite 不得超基线）
        run: python -X utf8 scripts/taint_gate.py
