[package]
name = "rx-search"
version = "0.1.0"
edition = "2021"
description = "unified-rx 本地语义代码检索（Rust）：标识符拆词 + 中文 bigram + 符号表 + BM25 混合检索——零外部依赖（CocoIndex/codesearch 式本地方案）"
license = "MIT"

[[bin]]
name = "rx-search"
path = "src/main.rs"

[lib]
name = "rx_search"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
