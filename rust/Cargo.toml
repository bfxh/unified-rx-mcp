[package]
name = "unified-rx-rs"
version = "2.75.0"
edition = "2024"
description = "unified-rx Rust 化（S78 地基 + S79 起逐域原生实现）：零依赖 JSON + MCP stdio 协议层 + 污点引擎 + fs 四工具（S90 写面收官）+ 检索域 + scan 轻正则三工具"
# 迁移红线（spec/VULN-HUNTING.md 五）：[dependencies] 恒空——与 Python 侧纯 stdlib 同纪律。
# 新增任何第三方 crate 前必须先改红线文档并说明理由（选型三问见 spec/LIBRARY-POLICY.md）。

[dependencies]

[lib]
name = "rxrs"
path = "src/lib.rs"

[[bin]]
name = "rx-mcp"
path = "src/bin/rx_mcp.rs"

[[bin]]
name = "rx-taint"
path = "src/bin/rx_taint.rs"

[[bin]]
name = "rx-fs"
path = "src/bin/rx_fs.rs"

[[bin]]
name = "rx-ide"
path = "src/bin/rx_ide.rs"

[[bin]]
name = "rx-search"
path = "src/bin/rx_search.rs"

[[bin]]
name = "rx-semantic"
path = "src/bin/rx_semantic.rs"

[[bin]]
name = "rx-scan"
path = "src/bin/rx_scan.rs"

[[bin]]
name = "rx-audit"
path = "src/bin/rx_audit.rs"

[[bin]]
name = "rx-appops"
path = "src/bin/rx_appops.rs"

[[bin]]
name = "rx-sys"
path = "src/bin/rx_sys.rs"

[[bin]]
name = "rx-svc"
path = "src/bin/rx_svc.rs"

[profile.release]
opt-level = 2
# S150 命令行加速（不变质量，实测证据见 ROUNDLOG S150 / bench/cli_bench.py）：
# 交错 A/B 30 轮 —— 旧配置中位 24.41ms → 以下三项 17.21ms（−29%，每次调用省 ~7ms；
# 纯启动成本，代码路径与输出逐字节不变，金标准 10 条全绿）。
lto = "fat"              # 跨 crate 内联 + 去重，二进制 2.89MB → 364KB
codegen-units = 1        # 单编译单元，最大化 LTO 收益（构建时间 +~20s，可接受）
strip = "symbols"        # 去调试符号（纯体积/加载收益，无行为影响）
# 注：panic="abort" 交错了 30 轮**无可测收益**（17.28 vs 17.21，噪声内）且会改
# panic 失败语义（不unwind）——按"不变质量"红线**不采用**。
