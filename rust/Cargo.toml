[package]
name = "unified-rx-rs"
version = "2.12.0"
edition = "2024"
description = "unified-rx Rust 化（S78 地基 + S79 起逐域原生实现）：零依赖 JSON + MCP stdio 协议层 + 污点引擎 + fs 读面 + 检索域 + scan 轻正则三工具"
# 迁移红线（spec/VULN-HUNTING.md 五）：[dependencies] 恒空——与 Python 侧纯 stdlib 同纪律。
# 新增任何第三方 crate 前必须先改红线文档并说明理由。

[dependencies]

[lib]
name = "rxrs"
path = "src/lib.rs"

[[bin]]
name = "rx-mcp"
path = "src/bin/rx_mcp.rs"

[[bin]]
name = "rx-taint"
path = "src/bin/rx_taint.rs"

[[bin]]
name = "rx-fs"
path = "src/bin/rx_fs.rs"

[[bin]]
name = "rx-search"
path = "src/bin/rx_search.rs"

[[bin]]
name = "rx-semantic"
path = "src/bin/rx_semantic.rs"

[[bin]]
name = "rx-scan"
path = "src/bin/rx_scan.rs"

[profile.release]
opt-level = 2
