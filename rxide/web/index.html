<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RX-IDE Lite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶栏：仅 3 个标签 + 右上角齿轮 -->
<header id="topbar">
  <div id="tabs">
    <button class="tab active" data-pane="editor">编辑器</button>
    <button class="tab" data-pane="browser">浏览器</button>
    <button class="tab" data-pane="term">终端</button>
  </div>
  <div id="top-right">
    <span id="file-indicator" title="Ctrl+O 打开 · Ctrl+S 保存">未命名</span>
    <button id="btn-settings" title="设置">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="8" cy="8" r="2.6"/>
        <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</header>

<!-- 编辑器标签 -->
<main id="pane-editor" class="pane active">
  <div id="editor-host">
    <div id="editor-placeholder">Ctrl+O 打开文件，或直接开始输入</div>
  </div>
  <aside id="changes-panel">
    <button id="changes-toggle" title="改动面板">‹</button>
    <div id="changes-body">
      <div id="changes-title">改动</div>
      <div id="changes-list"></div>
    </div>
  </aside>
</main>

<!-- 浏览器标签 -->
<main id="pane-browser" class="pane">
  <div id="browser-bar">
    <span id="browser-url"></span>
    <button id="btn-capture-error">🐞 捕获报错</button>
    <button id="btn-reload" title="刷新">⟳</button>
  </div>
  <iframe id="preview-frame" src="/preview/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</main>

<!-- 终端标签 -->
<main id="pane-term" class="pane">
  <div id="term-view" tabindex="0"></div>
  <div id="term-menu" class="ctx-menu hidden">
    <button data-act="copy">复制</button>
    <button data-act="to-cmd">粘贴到命令栏</button>
  </div>
</main>

<!-- 改动预览浮条（命令栏正上方，120px 半透明） -->
<div id="diff-float" class="hidden">
  <div id="diff-float-title"></div>
  <div id="diff-float-body"></div>
</div>

<!-- 一次性临时提示条（explain/fix 纯文本结果） -->
<div id="toast" class="hidden">
  <pre id="toast-text"></pre>
  <button id="toast-close" title="关闭 (ESC)">×</button>
</div>

<!-- 底部全局命令栏：40px，位于标签容器之外永远置底 -->
<footer id="cmdbar">
  <span id="cmd-sel-hint"></span>
  <span id="cmd-prompt">❯</span>
  <input id="cmd-input" type="text" autocomplete="off" spellcheck="false"
         placeholder="输入命令或需求…  Enter 发送 · Ctrl+Shift+Enter 强制 · Ctrl+Shift+I 隐藏">
  <span id="cmd-status"></span>
  <span id="cmd-ctx">📄 上下文: 0 行</span>
</footer>

<!-- 设置遮罩层 -->
<div id="settings-mask" class="hidden">
  <div id="settings-card">
    <h2>设置</h2>
    <label>API Key
      <input id="set-api-key" type="password" placeholder="sk-...">
    </label>
    <label>字体大小
      <input id="set-font-size" type="number" min="10" max="24" step="1">
    </label>
    <label>主题
      <select id="set-theme">
        <option value="dark">dark</option>
        <option value="light">light</option>
      </select>
    </label>
    <label>预览地址
      <input id="set-preview" type="text" placeholder="http://127.0.0.1:17300">
    </label>
    <div id="settings-actions">
      <button id="btn-set-save" class="primary">保存</button>
      <button id="btn-set-cancel">取消</button>
    </div>
  </div>
</div>

<script src="vendor/monaco/vs/loader.js"></script>
<script src="app.js"></script>
</body>
</html>
