[package]
name = "rx-core"
version = "0.1.0"
edition = "2021"
description = "unified-rx 纯函数层（Rust 迁移一期）：math/text/sort/search/stat/geo/conv/json/prime/list/fib"

# 纯标准库零依赖（对齐 Python 版零第三方依赖承诺）
# preserve_order：Object 键保序（对齐 Python dict 插入序；serde_json 默认 BTreeMap 排序）
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
